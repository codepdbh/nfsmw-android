plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nfsmw.android'
    compileSdk 35

    sourceSets {
        main.java.srcDirs += ["$rootDir/../sdk/thirdparty/sdl3/android-project/app/src/main/java"]
    }

    defaultConfig {
        applicationId 'com.nfsmw.android'
        minSdk 26
        targetSdk 35
        versionCode 11
        versionName '0.3.8'
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++23'
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
            // AGP builds release natives as RelWithDebInfo (-O2 -g); the game wants the SDK's Release
            // flags (-O3, no asserts) and ThinLTO (src/main/cpp/CMakeLists.txt).
            externalNativeBuild {
                cmake {
                    arguments '-DCMAKE_BUILD_TYPE=Release'
                }
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.30.5'
        }
    }

    ndkVersion '28.2.13676358'
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.documentfile:documentfile:1.0.1'
}
